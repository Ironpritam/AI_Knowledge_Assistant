[project]
name = "ai-knowledge-assistant"
version = "0.1.0"
description = "Production-ready AI Knowledge Assistant using FastAPI, Gemini and RAG."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # Backend
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.35.0",

    # Database
    "sqlalchemy>=2.0.51",
    "alembic>=1.19.0",
    "psycopg2-binary>=2.9.12",

    # Configuration
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",

    # AI
    "google-genai>=1.0.0",
    "sentence-transformers>=2.2.2",
    "chromadb>=1.5.9",
    "torch==2.13.0",

    # Document Processing
    "pymupdf>=1.28.0",
    "unstructured>=0.25.2",
    "tiktoken>=0.13.0",
    "langchain-text-splitters>=1.1.2",
]

[dependency-groups]
dev = [
    # "black>=25.1.0",
    "ruff>=0.12.8",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "httpx>=0.28.1",
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.uv]
managed = true
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv.sources]
torch = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
